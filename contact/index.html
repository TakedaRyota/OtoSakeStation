    <!-- CONTACT -->
    <div id="contact">
      <h1 class="title-font text-center">Contact</h1>
      <form class="container mb-5" action="./contactform.php" method="post">
        <div class="row">
          <div class="col-sm-4">
            <span class="badge bg-primary">任意</span>
            会社名
          </div>
          <div class="col-sm-8">
            <input class="form-control" type="text" placeholder="会社名"/>
          </div>
        </div>

        <div class="row">
          <div class="col-sm-4">
            <span class="badge bg-danger">必須</span>
            氏名
          </div>
          <div class="col-sm-8">
            <input class="form-control" type="text" placeholder="氏名" required/>
          </div>
        </div>

        <div class="row">
          <div class="col-sm-4">
            <span class="badge bg-danger">必須</span>
            メールアドレス
          </div>
          <div class="col-sm-8">
            <input class="form-control" type="email" placeholder="例) example@gmail.com" required/>
          </div>
        </div>

        <div class="row">
          <div class="col-sm-4">
            <span class="badge bg-danger">必須</span>
            お問い合わせの種類
          </div>
          <div class="col-sm-8">
            <select class="form-select">
              <option selected>選択してください</option>
              <option value="1">イベントに関して</option>
              <option value="2">制作依頼</option>
              <option value="3">出演に関して</option>
              <option value="4">その他</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="col-sm-4">
            <span class="badge bg-danger">必須</span>
            お問い合わせ内容
          </div>
          <div class="col-sm-8">
            <textarea class="form-control" rows="5"></textarea>
          </div>
        </div>

        <div class="row submit-row">
          <button class="btn btn-success btn-submit" type="submit">送信する</button>
        </div>
      </form>
    </div>
